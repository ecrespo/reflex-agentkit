name: Release

# A `v*` tag builds the sdist and wheel and publishes them to PyPI through trusted
# publishing (no stored token, REQ-032.2). Pre-release tags (`a`, `b`, `rc`) and final tags
# both go to PyPI through the `pypi` environment, which requires a reviewer. There is no
# TestPyPI step (Plan v1.2).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_NO_SYNC: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Check that the tag matches __version__
        run: |
          version="$(grep -Po '^__version__ = "\K[^"]+' src/reflex_agentkit/__init__.py)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reflex-agentkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
