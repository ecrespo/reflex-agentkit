name: Latest dependencies

# Weekly early warning (T-049, DD-001): resolve every dependency to its newest version
# allowed by the ranges in pyproject.toml, in a throwaway copy of the lock, and run the
# tests. It never changes the committed uv.lock and never blocks a merge; a failure
# opens (or updates) an issue so the maintainer can decide whether to pin or adapt.
#
# The newest versions are unvetted code, so the job that installs them has no token and
# no stored git credentials. A separate job, which installs nothing, files the issue.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.tests.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Upgrade the lock in a temporary copy and run the tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          log="${RUNNER_TEMP}/deps-latest.log"
          workdir="$(mktemp -d)"
          cp -r . "${workdir}/repo"
          cd "${workdir}/repo"
          {
            uv lock --upgrade
            uv sync --all-extras --all-packages
            uv run pytest -q
            uv run python scripts/check_gated_coverage.py
          } 2>&1 | tee "${log}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deps-latest-log
          path: ${{ runner.temp }}/deps-latest.log
          if-no-files-found: ignore

  report:
    needs: latest
    if: needs.latest.outputs.failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deps-latest-log
          path: log/
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Tests fail with the latest dependency versions"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          tail_log="$(tail -n 40 log/deps-latest.log 2>/dev/null || echo 'no log')"
          body="$(printf 'The weekly [latest-dependencies run](%s) failed.\n\nTail of the log:\n\n```text\n%s\n```\n' "${run_url}" "${tail_log}")"
          number="$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number')"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
