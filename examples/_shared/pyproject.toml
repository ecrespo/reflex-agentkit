[project]
name = "examples-shared"
version = "0.1.0"
description = "Model selection shared by the reflex-agentkit examples (Claude, Ollama or a test model)."
requires-python = ">=3.11"
dependencies = ["reflex-agentkit"]

[project.optional-dependencies]
pydantic-ai = ["reflex-agentkit[pydantic-ai]"]
langgraph = [
    "reflex-agentkit[langgraph]",
    "langchain-anthropic>=1.7.7,<2",
    "langchain-openai>=1.7.3,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples_shared"]

[tool.uv.sources]
reflex-agentkit = { workspace = true }
